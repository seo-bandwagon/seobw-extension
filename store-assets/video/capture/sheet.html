<!doctype html>
<!-- A blank spreadsheet for scene 6 of the demo video to paste into. The rough
     cut uses this local page; the final cut uses a real spreadsheet. -->
<html><head><meta charset="utf-8"><title>Untitled spreadsheet</title>
<style>
  body{margin:0;font:13px/1.2 Arial,Helvetica,sans-serif;background:#fff;color:#202124}
  .bar{height:44px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #e0e0e0}
  .bar b{font-size:18px;font-weight:400}
  table{border-collapse:collapse;table-layout:fixed}
  th,td{border:1px solid #e2e2e2;height:24px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  th{background:#f8f9fa;color:#5f6368;font-weight:400}
  th.r{width:40px} td.c{width:160px}
  td.hit{animation:fill .35s ease-out both}
  @keyframes fill{from{background:#d2e3fc}to{background:#fff}}
  .wide td.c:nth-child(4){width:300px} .wide td.c:nth-child(6){width:340px}
  .cols td.c:nth-child(2){width:130px} .cols td.c:nth-child(3),.cols td.c:nth-child(4){width:70px} .cols td.c:nth-child(5){width:220px} .cols td.c:nth-child(6){width:560px}
</style></head><body>
<div class="bar"><b>Untitled spreadsheet</b></div>
<table id="t"></table>
<script>
  const COLS = 'ABCDEFGH'.split(''), ROWS = 34, t = document.getElementById('t');
  t.innerHTML = '<tr><th class="r"></th>' + COLS.map(c => `<th>${c}</th>`).join('') + '</tr>' +
    Array.from({ length: ROWS }, (_, r) => `<tr><th class="r">${r + 1}</th>` + COLS.map(() => '<td class="c"></td>').join('') + '</tr>').join('');
  const cell = (r, c) => t.rows[r + 1] && t.rows[r + 1].cells[c + 1];
  // Copy results is TSV; show the first columns that fit: Query, Position, URL, Domain, Title, Snippet
  window.pasteRows = (tsv) => {
    document.body.classList.add('wide');
    tsv.split('\n').filter(Boolean).forEach((line, r) => line.split('\t').slice(0, COLS.length).forEach((v, c) => {
      const td = cell(r, c); if (!td) return; td.textContent = v; td.classList.add('hit'); td.style.animationDelay = (r * 40) + 'ms';
    }));
  };
  // A collected list (1.8.0): only the named columns, in that order.
  window.pasteColumns = (tsv, names) => {
    const lines = tsv.split('\n').filter(Boolean);
    const head = lines[0].split('\t');
    const idx = names.map(n => head.indexOf(n));
    document.body.classList.add('cols');
    lines.forEach((line, r) => {
      const cells = line.split('\t');
      idx.forEach((i, c) => {
        const td = cell(r, c); if (!td || i < 0) return;
        td.textContent = cells[i]; td.classList.add('hit'); td.style.animationDelay = (r * 30) + 'ms';
      });
    });
  };
  // Copy PAA is one question per line: two rows below the table, in column A
  window.pasteList = (text) => {
    const used = [...t.rows].findIndex((tr, i) => i > 0 && !tr.cells[1].textContent);
    text.split('\n').filter(Boolean).forEach((q, i) => {
      const td = cell(used + i, 0); if (!td) return; td.colSpan = 5; td.textContent = q; td.classList.add('hit'); td.style.animationDelay = (i * 60) + 'ms';
    });
  };
</script></body></html>
