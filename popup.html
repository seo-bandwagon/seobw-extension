<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 380px;
      max-height: 550px;
      overflow-y: auto;
      background: #1a1a2e;
      color: #eee;
      padding: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header h1 img { width: 20px; height: 20px; }
    .header a {
      font-size: 11px;
      color: #4cc9f0;
      text-decoration: none;
    }
    .header a:hover { text-decoration: underline; }
    
    .url {
      font-size: 10px;
      color: #666;
      word-break: break-all;
      margin-bottom: 12px;
      padding: 6px 8px;
      background: #0f0f1a;
      border-radius: 4px;
    }
    
    /* Score Header */
    .score-header {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #16213e;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .score-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
    }
    .score-circle .grade { font-size: 22px; }
    .score-circle .number { font-size: 10px; opacity: 0.8; }
    .score-a { background: linear-gradient(135deg, #06d6a0, #0a8f6c); }
    .score-b { background: linear-gradient(135deg, #4cc9f0, #3a9fc4); }
    .score-c { background: linear-gradient(135deg, #ffd166, #d4a84d); }
    .score-d { background: linear-gradient(135deg, #f77f00, #c46600); }
    .score-f { background: linear-gradient(135deg, #ef476f, #c43558); }
    .score-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      flex: 1;
    }
    .stat { text-align: center; }
    .stat-value { font-size: 16px; font-weight: 700; color: #4cc9f0; }
    .stat-label { font-size: 9px; color: #666; text-transform: uppercase; }
    
    /* Collapsible Sections */
    .section {
      background: #16213e;
      border-radius: 6px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .section-header {
      padding: 10px 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .section-header:hover { background: #1e2a4a; cursor: pointer; }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #4cc9f0;
    }
    .section-arrow {
      color: #666;
      transition: transform 0.2s;
    }
    .section.open .section-arrow { transform: rotate(180deg); }
    .section-content {
      display: none;
      padding: 0 12px 12px;
      font-size: 11px;
    }
    .section.open .section-content { display: block; }
    
    /* Data rows */
    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #0f0f1a;
    }
    .data-row:last-child { border: none; }
    .data-label { color: #888; }
    .data-value { color: #eee; font-weight: 500; }
    .data-value.good { color: #06d6a0; }
    .data-value.warn { color: #ffd166; }
    .data-value.bad { color: #ef476f; }
    
    /* Tags */
    .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .tag {
      background: #0f0f1a;
      padding: 3px 6px;
      border-radius: 3px;
      font-size: 10px;
    }
    .tag-count { color: #4cc9f0; margin-left: 4px; }
    
    /* Issues */
    .issue {
      background: #ef476f22;
      color: #ef476f;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 4px;
      font-size: 11px;
    }
    .pass {
      background: #06d6a022;
      color: #06d6a0;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
    }
    
    /* SERP Preview */
    .serp-preview {
      background: #fff;
      color: #000;
      padding: 10px;
      border-radius: 4px;
      font-family: Arial, sans-serif;
      margin-bottom: 8px;
    }
    .serp-title { color: #1a0dab; font-size: 16px; margin-bottom: 2px; }
    .serp-url { color: #006621; font-size: 12px; margin-bottom: 2px; }
    .serp-desc { color: #545454; font-size: 12px; line-height: 1.3; }
    
    /* Buttons */
    .actions {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }
    button {
      flex: 1;
      padding: 10px;
      background: #4361ee;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #3a56d4; }
    button.secondary { background: #16213e; }
    button:disabled { background: #333; cursor: not-allowed; }
    button.success { background: #06d6a0; }
    
    .status {
      font-size: 10px;
      text-align: center;
      margin-top: 6px;
      color: #888;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #888;
    }
  </style>
</head>
<body>
  <div id="content">
    <div class="loading">Analyzing page...</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
