<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SEO Bandwagon Settings</title>
  <link rel="stylesheet" href="../styles/popup.css">
</head>
<body class="page-options">
  <div class="container">
    <h1>
      <img src="../icons/icon48.png" alt="">
      SEO Bandwagon
    </h1>
    <p class="subtitle">Extension Settings</p>
    
    <div class="section">
      <div class="section-title">API Configuration</div>
      
      <label for="apiKey">API Key</label>
      <input type="password" id="apiKey" placeholder="Enter your API key">
      <p class="help-text">Get your API key from seobandwagon.dev/settings</p>
      
      <label for="apiUrl">API Endpoint</label>
      <input type="text" id="apiUrl" placeholder="https://seobandwagon.com/api">
      <p class="help-text">Default: https://seobandwagon.com/api</p>
    </div>
    
    <div class="section">
      <div class="section-title">Preferences</div>
      
      <div class="checkbox-row">
        <input type="checkbox" id="autoSave">
        <label for="autoSave">Auto-save captures (no click needed)</label>
      </div>
      
      <div class="checkbox-row">
        <input type="checkbox" id="showNotifications">
        <label for="showNotifications">Show save notifications</label>
      </div>
      
      <div class="checkbox-row">
        <input type="checkbox" id="localBackup">
        <label for="localBackup">Keep local backup of captures</label>
      </div>
    </div>
    
    <button id="saveBtn">Save Settings</button>
    <div class="status" id="status"></div>
  </div>
  
  <script src="../lib/api.js"></script>
  <script src="options.js"></script>
</body>
</html>
