      <div class="loading">Analyzing page…</div>
    </div>
  </div>

    </div>

      </label>

        <button type="button" id="creditsLink" class="credits-link">About &amp; credits</button>
        <span class="version-tag" id="versionTag"></span>
        <a href="#" data-review-link target="_blank" rel="noopener" class="privacy-link rate-link">RATE US ★</a>
        <a href="https://seobandwagon.com/privacy?utm_source=chrome_extension&amp;utm_medium=extension&amp;utm_campaign=popup" target="_blank" rel="noopener" class="privacy-link">PRIVACY</a>
      </span>
    </div>
  </footer>
