<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SEO Bandwagon - Capture History</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 40px;
      min-height: 100vh;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    h1 img { width: 32px; height: 32px; }
    .subtitle { color: #888; margin-bottom: 24px; }
    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    input[type="search"] {
      flex: 1;
      padding: 12px;
      background: #16213e;
      border: 1px solid #333;
      border-radius: 6px;
      color: #eee;
      font-size: 14px;
    }
    input:focus { outline: none; border-color: #4361ee; }
    button {
      padding: 12px 20px;
      background: #4361ee;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #3a56d4; }
    button.danger { background: #ef476f; }
    .capture-list { display: flex; flex-direction: column; gap: 12px; }
    .capture-item {
      background: #16213e;
      border-radius: 8px;
      padding: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .capture-item:hover { background: #1e2a4a; }
    .capture-url {
      font-size: 14px;
      color: #4cc9f0;
      word-break: break-all;
      margin-bottom: 8px;
    }
    .capture-meta {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: #888;
    }
    .capture-stat {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .empty-state {
      text-align: center;
      padding: 60px;
      color: #666;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      padding: 40px;
      overflow-y: auto;
    }
    .modal.open { display: block; }
    .modal-content {
      max-width: 800px;
      margin: 0 auto;
      background: #16213e;
      border-radius: 12px;
      padding: 24px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-close {
      background: none;
      border: none;
      color: #888;
      font-size: 24px;
      cursor: pointer;
    }
    pre {
      background: #0f0f1a;
      padding: 16px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
      max-height: 500px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      <img src="icons/icon48.png" alt="">
      Capture History
    </h1>
    <p class="subtitle">Local backup of analyzed pages</p>
    
    <div class="toolbar">
      <input type="search" id="search" placeholder="Search by URL...">
      <button id="exportUrlsBtn">Export URLs</button>
      <button id="exportAllBtn">Export JSON</button>
      <button id="clearBtn" class="danger">Clear History</button>
    </div>
    
    <div class="capture-list" id="captureList">
      <div class="empty-state">Loading...</div>
    </div>
  </div>
  
  <div class="modal" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Capture Details</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <pre id="modalData"></pre>
    </div>
  </div>
  
  <script src="history.js"></script>
</body>
</html>
