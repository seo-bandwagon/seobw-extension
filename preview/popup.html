<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../extension/src/styles/fonts.css">
  <script src="../extension/src/lib/theme-mode.js"></script>
  <link rel="stylesheet" href="../extension/src/styles/popup.css">
  <script src="stub.js"></script>
</head>
<body class="page-popup">
  <header class="chrome">
    <div class="chrome-mark">SB</div>
    <div class="chrome-word">SEO BANDWAGON</div>
    <nav class="switcher">
      <button class="active" data-tab="seo">ANALYSIS</button>
      <button data-tab="citations">CITATIONS</button>
    </nav>
  </header>

  <div class="tab-panel active" id="tab-seo">
    <!-- Fix round 1, item 15: lives inside the ANALYSIS tab panel, not a header-level sibling of both panels, so it never renders while the CITATIONS tab is active. -->
    <div id="reviewStrip"></div>
    <div id="content"><div class="loading">Analyzing page…</div></div>
  </div>

  <div class="tab-panel" id="tab-citations">
    <div id="cf-content"><div class="loading">Loading…</div></div>
  </div>

  <footer class="footer">
    <div class="footer-toggle">
      <label class="toggle-label">
        <input type="checkbox" id="dataToggle" checked>
        <span>HELP IMPROVE SEO INSIGHTS</span>
      </label>
      <span class="footer-right">
        <button type="button" id="creditsLink" class="credits-link">About &amp; credits</button>
        <span class="version-tag" id="versionTag"></span>
        <a href="#" data-review-link target="_blank" rel="noopener" class="privacy-link rate-link">RATE US ★</a>
        <a href="#" class="privacy-link">PRIVACY</a>
      </span>
    </div>
  </footer>

  <div class="credits" id="creditsPanel" hidden></div>

  <script src="../extension/src/lib/sync-state.js"></script>
  <script src="../extension/src/lib/api.js"></script>
  <script src="../extension/src/lib/citations-ui.js"></script>
  <script src="../extension/src/lib/options-logic.js"></script>
  <script src="../extension/src/lib/site-links.js"></script>
  <script src="../extension/src/lib/link-building-ui.js"></script>
  <script src="../extension/src/lib/domain-history.js"></script>
  <script>
    // popup.js's top-level chrome.tabs.query(...) callback runs synchronously
    // at parse time (like sidepanel.js's initSidePanel(), see sidepanel.html)
    // — it calls SBW.quickDomain/capturesForUrl via loadDomainHistory() before
    // stub.js's own DOMContentLoaded handler would otherwise install the
    // stubs, so install them here instead.
    installSbwStubs();
  </script>
  <script src="../extension/src/lib/nap-compare.js"></script>
  <script src="../extension/src/lib/directory-matcher.js"></script>
  <script src="../extension/src/lib/sub-scores.js"></script>
  <script src="../extension/src/lib/analysis-errors.js"></script>
  <script src="../extension/src/lib/review-prompt.js"></script>
  <script src="../extension/src/popup/popup.js"></script>
  <script src="../extension/src/lib/fullpage-plan.js"></script>
  <script src="../extension/src/lib/proof-store.js"></script>
  <script src="../extension/src/popup/citations-tab.js"></script>
  <script src="../extension/src/lib/perms.js"></script>
  <script src="../extension/src/lib/csv.js"></script>
  <script src="../extension/src/lib/export-rows.js"></script>
  <script src="../extension/src/lib/link-check.js"></script>
  <script src="../extension/src/popup/link-check.js"></script>
  <script src="../extension/src/lib/redirect-chain.js"></script>
  <script src="../extension/src/popup/indexability.js"></script>
  <script src="../extension/src/lib/hreflang.js"></script>
  <script src="../extension/src/popup/hreflang.js"></script>
  <script src="../extension/src/lib/html-diff.js"></script>
  <script src="../extension/src/lib/ua-switch.js"></script>
  <script src="../extension/src/popup/render-check.js"></script>
  <script src="../extension/src/lib/structured-data.js"></script>
  <script src="../extension/src/lib/capture-strip.js"></script>
  <script src="../extension/src/lib/credits.js"></script>
  <script src="../extension/src/popup/structured-data.js"></script>
  <script src="../extension/src/lib/tool-links.js"></script>
  <script src="../extension/src/popup/tools.js"></script>
  <script src="../extension/src/popup/review.js"></script>
</body>
</html>
