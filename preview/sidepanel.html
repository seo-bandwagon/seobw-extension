<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../extension/src/styles/fonts.css">
  <script src="../extension/src/lib/theme-mode.js"></script>
  <link rel="stylesheet" href="../extension/src/styles/popup.css">
  <script src="stub.js"></script>
</head>
<body class="page-sidepanel">
  <header class="sp-head">
    <div class="sp-mark">SB</div>
    <div class="sp-word">SEO BANDWAGON</div>
    <span class="version-tag" id="spVersion"></span>
    <span class="sp-user" id="spUser"></span>
    <div class="sp-appearance" id="spAppearance" role="group" aria-label="Appearance" title="Night / Day for the extension's own pages. Auto follows your system setting.">
      <button type="button" data-mode="auto" aria-pressed="true">Auto</button>
      <button type="button" data-mode="dark" aria-pressed="false">Night</button>
      <button type="button" data-mode="light" aria-pressed="false">Day</button>
    </div>
  </header>

  <nav class="sp-mode" id="spModeNav">
    <button class="active" data-mode="citations">CITATIONS</button>
    <button data-mode="links">LINKS</button>
  </nav>

  <nav class="sp-nav" id="spNav">
    <button class="active" data-section="businesses">BUSINESSES</button>
    <button data-section="campaigns">CAMPAIGNS</button>
    <button data-section="citations">CITATIONS</button>
  </nav>

  <div id="spFilters"></div>
  <div class="sp-scroll" id="spBody"><div class="loading">Loading…</div></div>
  <footer class="sp-foot">
    <span class="sp-foot-stat" id="spFootStat"></span>
    <button class="sp-foot-link" id="spPageChecks">Page checks →</button>
    <button class="sp-foot-link" id="spExport">Export CSV</button>
  </footer>

  <script src="../extension/src/lib/api.js"></script>
  <script src="../extension/src/lib/citations-ui.js"></script>
  <script src="../extension/src/lib/link-building-ui.js"></script>
  <script>
    // sidepanel.js calls initSidePanel() at parse time (unlike the popup's
    // citations-tab.js, which only initializes on a later click) — the
    // SBW.ct.* / SBW.lb.* stubs must already be in place before that runs, so
    // it can't wait for DOMContentLoaded like the rest of stub.js's setup.
    installSbwStubs();
  </script>
  <script src="../extension/src/lib/nap-compare.js"></script>
  <script src="../extension/src/lib/directory-matcher.js"></script>
  <script src="../extension/src/sidepanel/sidepanel.js"></script>
  <script>
    // Drive the requested side-panel section
    const SP_TARGET = new URLSearchParams(location.search).get('section');
    if (SP_TARGET) {
      setTimeout(() => document.querySelector(`#spNav button[data-section="${SP_TARGET}"]`)?.click(), 700);
    }
    // Pitches default to the draft filter — click into approved for that state.
    if (PREVIEW_STATE === 'lb-pitches-approved') {
      setTimeout(() => document.querySelector('#spFilters [data-v="approved"]')?.click(), 900);
    }
  </script>
</body>
</html>
