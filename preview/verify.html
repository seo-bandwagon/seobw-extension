<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>verify</title>
<style>body{font:13px/1.6 monospace;background:#111;color:#eee;padding:20px}
.ok{color:#16C784}.bad{color:#E5484D}pre{white-space:pre-wrap}</style></head>
<body>
<pre id="out">running…</pre>
<script>
// Loads every state in a hidden iframe and asserts the expected DOM landed.
const CASES = [
  { q: 'popup.html?state=main-known',   need: ['.dir-hero', '.act-hero', '.act-tile', '.cf-foot'], no: ['.dir-hero.unknown'] },
  { q: 'popup.html?state=main-unknown', need: ['.dir-hero.unknown', '.act-hero'] },
  { q: 'popup.html?state=picker',       need: ['.picker', '.picker-row'] },
  { q: 'popup.html?state=signed-out',   need: ['.signed-out', '.signed-out-cta', '.proof-strip'] },
  { q: 'popup.html?state=no-businesses',need: ['.empty-title'] },
  { q: 'popup.html?state=no-citations', need: ['.recent'] },
  { q: 'popup.html?state=seo',          need: ['.seo-hero', '.ring', '.subscore', '.section', '.badge-mono'] },
  { q: 'popup.html?state=nap-drift',    need: ['.nap-head', '.nap-field', '.btn-fill'], click: '#cfNap' },
  { q: 'popup.html?state=nap-perfect',  need: ['.nap-head', '.nap-field'], click: '#cfNap' },
  { q: 'popup.html?state=nap-error',    need: ['.alert-error'], click: '#cfNap' },
  { q: 'popup.html?state=proof',        need: ['.proof', '.proof-thumb', '.proof-chip'], click: '#cfShot' },
  { q: 'popup.html?state=filed',        need: ['.alert-success'], click: '#cfReport' },
  { q: 'sidepanel.html?state=main-known&section=businesses',  need: ['.sp-row', '.sp-idx'] },
  { q: 'sidepanel.html?state=main-known&section=citations',   need: ['.sp-chip', '.sp-row', '.sp-bar'] },
  { q: 'sidepanel.html?state=main-known&section=campaigns',   need: ['.sp-trigger', '.sp-row'] },
  { q: 'sidepanel.html?state=main-known&section=screenshots', need: ['.sp-gallery', '.sp-shot'] }
];

const out = document.getElementById('out');
const lines = [];
let failures = 0;

// Poll for a condition instead of guessing a delay — hidden iframes get their
// timers throttled, so any fixed wait is a coin flip.
function waitFor(fn, ms = 12000, step = 120) {
  return new Promise(resolve => {
    const t0 = Date.now();
    (function tick() {
      let v = false;
      try { v = fn(); } catch (e) { /* document not ready yet */ }
      if (v) return resolve(true);
      if (Date.now() - t0 > ms) return resolve(false);
      setTimeout(tick, step);
    })();
  });
}

function run(c) {
  return new Promise(resolve => {
    const f = document.createElement('iframe');
    f.style.cssText = 'width:500px;height:600px;position:absolute;left:-9999px';
    f.src = c.q;
    const errs = [];
    f.onload = async () => {
      f.contentWindow.addEventListener('error', e => errs.push(e.message));
      f.contentWindow.addEventListener('unhandledrejection',
        e => errs.push('rejected: ' + (e.reason?.message || e.reason)));
      const d = () => f.contentDocument;

      if (c.click) {
        await waitFor(() => d().querySelector(c.click));
        d().querySelector(c.click)?.click();
      }
      await waitFor(() => c.need.every(s => d().querySelector(s)));

      const missing = c.need.filter(s => !d().querySelector(s));
      const present = (c.no || []).filter(s => d().querySelector(s));
      const ok = !missing.length && !present.length && !errs.length;
      if (!ok) failures++;
      lines.push(`${ok ? '  OK  ' : ' FAIL '} ${c.q}` +
        (missing.length ? `\n         missing: ${missing.join(', ')}` : '') +
        (present.length ? `\n         should not exist: ${present.join(', ')}` : '') +
        (errs.length ? `\n         errors: ${errs.join(' | ')}` : ''));
      out.textContent = lines.join('\n');
      f.remove();
      resolve();
    };
    document.body.appendChild(f);
  });
}

// The preview pages duplicate the real shells so stub.js can load first.
// Compare the two (ignoring <script> tags and hrefs) so they can't drift apart
// unnoticed — a mismatch means the preview is verifying stale markup.
async function checkShellDrift(realUrl, previewUrl, label) {
  const norm = async (u) => {
    const html = await (await fetch(u)).text();
    const d = new DOMParser().parseFromString(html, 'text/html');
    d.body.querySelectorAll('script').forEach(s => s.remove());
    // The preview deliberately neuters outbound links — normalise navigation
    // attributes so only structure and copy are compared.
    d.body.querySelectorAll('a').forEach(a => {
      a.setAttribute('href', '#');
      a.removeAttribute('target');
      a.removeAttribute('rel');
    });
    // Structural comparison only — indentation between tags is not divergence.
    return d.body.innerHTML.replace(/\s+/g, ' ').replace(/>\s+</g, '><').trim();
  };
  const [a, b] = await Promise.all([norm(realUrl), norm(previewUrl)]);
  if (a === b) {
    lines.push(`  OK   shell matches src: ${label}`);
  } else {
    failures++;
    let i = 0; while (i < a.length && a[i] === b[i]) i++;
    lines.push(` FAIL  shell drift: ${label}` +
      `\n         src:     …${a.slice(Math.max(0, i - 30), i + 70)}` +
      `\n         preview: …${b.slice(Math.max(0, i - 30), i + 70)}`);
  }
  out.textContent = lines.join('\n');
}

(async () => {
  await checkShellDrift('../src/popup/popup.html', 'popup.html', 'popup');
  await checkShellDrift('../src/sidepanel/sidepanel.html', 'sidepanel.html', 'sidepanel');
  for (const c of CASES) await run(c);
  lines.push('', failures ? `${failures} FAILING` : 'ALL PASS');
  out.textContent = lines.join('\n');
  window.__done = true;
  window.__failures = failures;
})();
</script>
</body>
</html>
