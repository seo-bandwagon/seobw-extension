<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SEO Bandwagon Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 40px;
      min-height: 100vh;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    h1 img { width: 32px; height: 32px; }
    .subtitle {
      color: #888;
      margin-bottom: 32px;
    }
    .section {
      background: #16213e;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #4cc9f0;
    }
    label {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px;
      background: #0f0f1a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #eee;
      font-size: 14px;
      margin-bottom: 16px;
    }
    input:focus {
      outline: none;
      border-color: #4361ee;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .checkbox-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
    }
    .checkbox-row label {
      margin: 0;
      color: #eee;
      font-size: 14px;
    }
    button {
      padding: 12px 24px;
      background: #4361ee;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #3a56d4; }
    .status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    .status.success {
      display: block;
      background: #06d6a033;
      color: #06d6a0;
    }
    .status.error {
      display: block;
      background: #ef476f33;
      color: #ef476f;
    }
    .help-text {
      font-size: 11px;
      color: #666;
      margin-top: -12px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      <img src="icons/icon48.png" alt="">
      SEO Bandwagon
    </h1>
    <p class="subtitle">Extension Settings</p>
    
    <div class="section">
      <div class="section-title">API Configuration</div>
      
      <label for="apiKey">API Key</label>
      <input type="password" id="apiKey" placeholder="Enter your API key">
      <p class="help-text">Get your API key from seobandwagon.com/settings</p>

      <label for="apiUrl">API Endpoint</label>
      <input type="text" id="apiUrl" placeholder="https://seobandwagon.com/api">
      <p class="help-text">Default: https://seobandwagon.com/api</p>
    </div>
    
    <div class="section">
      <div class="section-title">Preferences</div>
      
      <div class="checkbox-row">
        <input type="checkbox" id="autoSave">
        <label for="autoSave">Auto-save captures (no click needed)</label>
      </div>
      
      <div class="checkbox-row">
        <input type="checkbox" id="showNotifications">
        <label for="showNotifications">Show save notifications</label>
      </div>
      
      <div class="checkbox-row">
        <input type="checkbox" id="localBackup">
        <label for="localBackup">Keep local backup of captures</label>
      </div>
    </div>
    
    <button id="saveBtn">Save Settings</button>
    <div class="status" id="status"></div>
  </div>
  
  <script src="options.js"></script>
</body>
</html>
