name: Release / store review
description: Track a release or Chrome Web Store submission
labels: ["release"]
body:
  - type: input
    id: version
    attributes:
      label: Target version
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: Checklist
      value: |
        - [ ] Version bumped, manifest `version_name` updated
        - [ ] CHROMEWEBSTORE.md row and ROADMAP changelog added
        - [ ] MANUAL_SMOKE_TEST.md run
        - [ ] `npm run check:zip` passes
        - [ ] Submitted to Chrome Web Store
