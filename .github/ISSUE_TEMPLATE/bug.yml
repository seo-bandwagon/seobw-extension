name: Bug report
description: Something in the extension is broken
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include steps to reproduce and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
  - type: textarea
    id: logs
    attributes:
      label: Console / service-worker errors
