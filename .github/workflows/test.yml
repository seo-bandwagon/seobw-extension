name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The bump check diffs against the base branch, so it needs history.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Store zip contains every referenced file
        run: npm run check:zip

      - name: Version bumped when shipped code changed
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-version-bump.mjs "origin/$BASE_REF"

  e2e-offline:
    name: E2E (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 2026-10-22: twice in a row this step stalled for the job's whole
      # 10 minutes on one 7.5 MB font package (fonts-wqy-zenhei) from
      # azure.archive.ubuntu.com; on 2026-10-21 it took 32 s. A 30 s apt
      # timeout with retries fails a stalled download fast and moves on to
      # the next mirror in the runner's mirror list.
      - name: Make apt give up on a stalled mirror
        run: |
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-retries-timeouts

      # Full Chromium (not headless-shell) is required for MV3 extensions
      - name: Install Playwright Chromium + system deps
        run: npx playwright install --with-deps chromium

      # Only the specs that never leave the runner: Collect pages answers
      # google.com/search from tests/fixtures, the account spec answers
      # seobandwagon.com/api from stubs, and both block everything else. No
      # secrets. The production canary stays in canary.yml.
      - name: Run offline e2e under xvfb
        run: xvfb-run --auto-servernum -- npm run test:e2e -- tests/e2e/serp-collect.spec.mjs tests/e2e/account.spec.mjs

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-trace-offline
          path: test-results/
          retention-days: 7
