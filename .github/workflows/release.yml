name: Release

# Tests and builds the store zips and attaches them to a GitHub release: the
# Chrome Web Store's, seo-bw-extension-X.Y.Z.zip (the name store-submit.yml
# downloads), and Microsoft Edge Add-ons', seo-bw-extension-edge-X.Y.Z.zip
# (from 1.13.6; uploaded by hand in Partner Center for now). It touches
# nothing in either store: submitting is a separate run that the owner starts
# on purpose (store-submit.yml), which is the approval step.
# Nothing here runs on its own; it starts only from "Run workflow".
# See docs/RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to release (its manifest.json sets the version)
        default: main
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Test and build the zip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - name: Store zip contains every referenced file
        run: npm run check:zip

      - name: Version
        id: version
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released. Bump the version (npm run bump) before releasing again."
            exit 1
          fi

      - name: Zips
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm run zip -- --target chrome "seo-bw-extension-$VERSION.zip"
          npm run zip -- --target edge "seo-bw-extension-edge-$VERSION.zip"
          node scripts/release-notes.mjs "seo-bw-extension-$VERSION.zip" "seo-bw-extension-edge-$VERSION.zip" > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            seo-bw-extension-${{ steps.version.outputs.version }}.zip
            seo-bw-extension-edge-${{ steps.version.outputs.version }}.zip
            release-notes.md
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Create v${{ needs.build.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          gh release create "v$VERSION" "seo-bw-extension-$VERSION.zip" "seo-bw-extension-edge-$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "v$VERSION" \
            --notes-file release-notes.md --generate-notes
