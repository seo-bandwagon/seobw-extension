name: E2E Canary

on:
  # Weekly — Monday 09:00 UTC
  schedule:
    - cron: '0 9 * * 1'
  # Run on push to main so merges get verified immediately
  push:
    branches: [main]
  # Manual trigger from Actions tab
  workflow_dispatch:

jobs:
  canary:
    name: Playwright canary
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Full Chromium (not headless-shell) is required for MV3 extensions
      - name: Install Playwright Chromium + system deps
        run: npx playwright install --with-deps chromium

      # xvfb-run provides a virtual display for headful Chromium in CI
      - name: Run canary under xvfb
        run: xvfb-run --auto-servernum -- npm run test:e2e

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7

  notify-on-failure:
    name: Auto-create issue on scheduled failure
    runs-on: ubuntu-latest
    needs: canary
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - name: Open issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[canary] Weekly e2e failed — ${new Date().toISOString().slice(0,10)}`,
              body: `The scheduled canary run failed. Likely causes:\n\n- Extension broken against the current production page\n- seobandwagon.com/local-seo changed in a way that fails assertions\n- /api/v1/captures rejecting valid payloads\n- Service-worker or Chromium compatibility regression\n\nRun: ${runUrl}\n\nInvestigate before next Monday's run.`,
              labels: ['canary', 'bug']
            });
