name: E2E Canary

on:
  # Weekly — Monday 09:00 UTC
  schedule:
    - cron: '0 9 * * 1'
  # Run on push to main so merges get verified immediately
  push:
    branches: [main]
  # Manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: Playwright canary
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Full Chromium (not headless-shell) is required for MV3 extensions
      - name: Install Playwright Chromium + system deps
        run: npx playwright install --with-deps chromium

      # xvfb-run provides a virtual display for headful Chromium in CI
      # SBW_CANARY_KEY (optional): an sbw_ API key with the `captures` scope,
      # from a dedicated account. Set, the canary uploads a real capture;
      # unset, it checks that the extension refuses without a key and that
      # production answers an anonymous capture with 401.
      - name: Run canary under xvfb
        env:
          SBW_CANARY_KEY: ${{ secrets.SBW_CANARY_KEY }}
        run: xvfb-run --auto-servernum -- npm run test:e2e

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7

  notify-on-failure:
    name: Auto-create issue on scheduled failure
    runs-on: ubuntu-latest
    needs: canary
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - name: Open issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'canary-failure', per_page: 1
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open.data[0].number,
                body: `Canary failed again: ${runUrl}`
              });
              return;
            }
            await github.rest.issues.create({
              owner, repo,
              title: `[canary] Weekly e2e failed — ${new Date().toISOString().slice(0,10)}`,
              body: `The scheduled canary run failed. Likely causes:\n\n- Extension broken against the current production page\n- seobandwagon.com/local-seo changed in a way that fails assertions\n- /api/v1/captures rejecting valid payloads\n- Service-worker or Chromium compatibility regression\n\nRun: ${runUrl}\n\nInvestigate before next Monday's run.`,
              labels: ['canary-failure', 'type:bug']
            });
